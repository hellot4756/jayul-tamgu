<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'맑은 고딕','Malgun Gothic',sans-serif;color:#222;background:#eceef2;font-size:15px}
  header{background:#2f4b7c;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;flex:1}
  header button{background:#fff;color:#2f4b7c;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
  .status{font-size:13px;opacity:.9}
  main{max-width:1000px;margin:0 auto;padding:12px}
  .card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .login{max-width:380px;margin:40px auto}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tabs button{flex:1;padding:8px;border:1px solid #bbb;background:#fff;border-radius:6px;cursor:pointer;font:inherit}
  .tabs button.on{background:#2f4b7c;color:#fff;border-color:#2f4b7c}
  label{display:block;font-weight:bold;margin:12px 0 4px}
  input[type=text],input[type=password],select{width:100%;padding:8px;border:1px solid #bbb;border-radius:6px;font:inherit}
  .btn{background:#2f4b7c;color:#fff;border:0;border-radius:6px;padding:8px 13px;cursor:pointer;font:inherit}
  .btn.sub{background:#e8ebf2;color:#2f4b7c}
  .btn:disabled{opacity:.5}
  .err{color:#c0392b;margin-top:8px;white-space:pre-wrap}
  .note{background:#fff8e1;border:1px solid #f0d98a;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
  .small{font-size:12px;color:#666}

  /* 도구 막대 */
  .tb{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ccd;padding:6px 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .tb button,.tb select{border:1px solid #bbc;background:#f7f8fb;border-radius:5px;padding:5px 8px;cursor:pointer;font:inherit;font-size:13px;min-width:32px}
  .tb button:hover{background:#e6ebf6}
  .tb button.primary{background:#2f4b7c;color:#fff;border-color:#2f4b7c;font-weight:bold}
  .tb button.primary:hover{background:#244069}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2f4b7c;color:#fff;padding:10px 18px;border-radius:20px;z-index:99;display:none;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .tb .sep{width:1px;height:22px;background:#ccd;margin:0 4px}
  .tb select{width:auto}

  /* 문서(양식) */
  .page{background:#fff;max-width:900px;margin:0 auto;padding:22px 26px;box-shadow:0 1px 4px rgba(0,0,0,.15);min-height:400px}
  .doc{font-size:14px;line-height:1.55;outline:none}
  .doc h1{font-size:19px;margin:0 0 6px;text-align:center}
  .doc h2{font-size:16px;margin:14px 0 6px;text-align:center}
  .doc h3{font-size:14.5px;margin:16px 0 4px}
  .doc p{margin:3px 0}
  .doc .idline{text-align:right;margin-bottom:6px}
  .doc .guide{color:#777;font-size:12.5px;margin:2px 0 4px}
  .doc table{border-collapse:collapse;width:100%;table-layout:fixed;margin:0}
  .doc table.f td,.doc table.f th{border:1px solid #666;padding:5px 7px;vertical-align:top;word-break:break-all;overflow-wrap:anywhere}
  .doc table.f.hdr{margin-top:6px}
  .doc table.f[data-rep]{margin-top:-1px}
  .doc td.lab{background:#eef0f4;font-weight:bold;font-size:13px}
  .doc td.lab.c{text-align:center;vertical-align:middle}
  .doc td.hd{background:#dde2ec;font-weight:bold;text-align:center}
  .doc table.in td{border:1px solid #999;font-size:12.5px}
  .doc table.ut{margin:6px 0}
  .doc table.ut td{border:1px solid #666;padding:4px 6px;min-width:40px}
  .doc a{color:#1a56c4;text-decoration:underline}
  .doc img{max-width:100%;height:auto;vertical-align:middle}
  .doc .cb{cursor:pointer;font-weight:bold;user-select:none}
  .doc .inl{display:inline-block;min-width:36px;border-bottom:1px solid #666;text-align:center;padding:0 4px}
  .doc [data-ans]{min-height:2.3em}
  .doc div[data-ans].big{min-height:260px}
  .doc [data-ans]:empty::before{content:attr(data-ph);color:#aaa;pointer-events:none}
  .doc.student [data-ans]{background:#f3f7ff;cursor:text;box-shadow:inset 0 0 0 1.5px #a9bde8;border-radius:3px}
  .doc.student div[data-ans]{padding:6px 8px;margin-top:4px}
  .doc.student td[data-ans]{padding:6px 8px}
  .doc.student [data-ans]:focus{outline:2px solid #3f6fd6;background:#fff;box-shadow:none}
  .doc.student [data-ans]:empty:not([data-ph]):not(.inl)::before{content:'✎ 여기를 눌러 쓰세요';color:#8fa3cf}
  .doc.student .inl{box-shadow:inset 0 -2px 0 #6c8cd5;border-radius:0;min-width:48px}
  .doc.view [data-ans]:empty::before{content:''}
  .doc.tpl [data-ans]{background:#fffbe0;outline:1px dashed #d0b24a}
  .doc.tpl [data-rep]{outline:2px solid #6ab07c;outline-offset:-2px}
  .doc.tpl{outline:1px dashed #99a;padding:2px}
  .doc mark.pasted{background:none;color:inherit}
  .doc.view .pasted{background:#ffd9d6}
  .doc .bar{margin:6px 0 10px;display:flex;gap:8px}
  .doc .bar button{border:1px solid #6c8cd5;background:#eef3ff;color:#2f4b7c;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}


  /* 개인 코드지 */
  .sheet{width:194mm;margin:0 auto 14px;display:grid;grid-template-columns:1fr 1fr;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .sheet.n8{height:281mm;grid-template-rows:repeat(4,1fr)}
  .sheet.n6{height:281mm;grid-template-rows:repeat(3,1fr)}
  .cardp{border:1px dashed #888;padding:5mm 6mm;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;font-size:11px;line-height:1.35}
  .cardp .ct{font-weight:bold;font-size:13px;color:#2f4b7c;border-bottom:1.5px solid #2f4b7c;padding-bottom:2mm}
  .cardp .cr{font-size:14px}.cardp .cr b{font-size:18px;margin:0 8px 0 6px}.cardp .cl,.cardp .cl2{color:#666;font-size:11px}
  .cardp .cn{color:#444}
  .cardp .cc{font-family:'Consolas','Courier New',monospace;font-size:30px;font-weight:bold;letter-spacing:5px;text-align:center;border:2px solid #2f4b7c;border-radius:6px;padding:2mm 0;background:#f3f7ff}
  .sheet.n6 .cardp .cc{font-size:36px}
  .cardp .cu{font-size:11px;color:#333;word-break:break-all}.cardp .cu b{font-size:12px}
  .cardp .cw{font-size:9.5px;color:#777}
  .cardp.empty{border-color:transparent}

  /* 교사 */
  table.ov{border-collapse:collapse;width:100%}
  table.ov th,table.ov td{border:1px solid #ccc;padding:5px;font-size:13px;text-align:center}
  table.ov th{background:#eee}
  table.ov td.n{text-align:left;white-space:nowrap}
  .cell{cursor:pointer}.cell:hover{background:#eef3ff}
  .warn{background:#fdecea}
  .badge{display:inline-block;background:#c0392b;color:#fff;border-radius:10px;padding:1px 7px;font-size:12px}
  .badge.ok{background:#888}
  .pasterow{background:#fdecea}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;overflow:auto;padding:20px}
  .modal .box{background:#fff;max-width:940px;margin:0 auto;border-radius:10px;padding:14px}
  @media print{
    @page{size:A4;margin:14mm}
    @page cards{size:A4;margin:8mm}
    header,.tb,.noprint,.bar,.note,.tabs,#toast{display:none!important}
    body{background:#fff}main{padding:0;max-width:none}
    .page{box-shadow:none;padding:0;margin:0;max-width:none;min-height:0}
    .doc{font-size:12px}
    .doc.view .pasted,.doc mark.pasted{background:none!important}
    .doc.student [data-ans],.doc.tpl [data-ans]{background:none!important;box-shadow:none!important;outline:none!important}
    .doc [data-ans]:empty::before{content:''!important}
    .doc div[data-ans].big{min-height:200px}
    .doc td.lab,.doc td.hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .doc table tr{page-break-inside:avoid}
    .doc a{color:#000}
    .sheet{page:cards;width:auto;margin:0;box-shadow:none;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .sheet:last-child{page-break-after:auto;break-after:auto}
    .cardp{border-color:#888}
  }
</style>
</head>
<body>
<header>
  <h1 id="title">〈화법과 언어〉 자율 탐구</h1>
  <span class="status" id="status"></span>
  <button id="btnOut" style="display:none" onclick="logout()">나가기</button>
</header>
<div id="tb" class="tb" style="display:none"></div>
<main id="root"></main>
<div id="modal" class="modal" style="display:none"></div>
<div id="toast"></div>

<script>
var TOKEN = '', ROLE = '', MODE = '';           // MODE: student / tpl / view
var DOC = null;                                   // 현재 편집 중인 문서 요소
var S = { act:'', ver:0, dirty:false, saving:false, timer:null, pend:[] };
var IMGC = {};                                    // 이미지 캐시
var LASTRANGE = null, INTERNAL = '', DRAGINT = false;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function ssGet(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
function ssSet(k, v){ try { sessionStorage.setItem(k, v); } catch(e){} }
function ssDel(k){ try { sessionStorage.removeItem(k); } catch(e){} }
function setStatus(t){ $('status').textContent = t || ''; }
function api(name, args, body, ctype){
  var hd = {}; if (TOKEN) hd.Authorization = 'Bearer ' + TOKEN;
  if (ctype) hd['Content-Type'] = ctype; else if (!body) hd['Content-Type'] = 'application/json';
  return fetch('/api/' + name, { method:'POST', headers:hd, body: body || JSON.stringify(args || []), cache:'no-store' })
    .then(function(r){ return r.json().catch(function(){ return { ok:false, error:'서버 응답을 읽지 못했습니다.' }; }); })
    .catch(function(){ return { ok:false, error:'인터넷 연결을 확인해 주세요.', net:true }; });
}
function call(name, args, ok, ng){
  api(name, args).then(function(j){
    if (j.ok) { ok && ok(j.r); return; }
    var m = j.error || '오류';
    if (m === 'AUTH'){ logout(true); return; }
    (ng || function(x){ alert(x); })(m);
  });
}
function fmt(ms){
  if (!ms) return '';
  var d = new Date(Number(ms) + 9 * 3600000), p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()) + ' ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds());
}

// ───────── 안전한 HTML 걸러내기 ─────────
var OK_TAGS = {DIV:1,SPAN:1,P:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,S:1,SUB:1,SUP:1,SMALL:1,TABLE:1,TBODY:1,THEAD:1,TR:1,TD:1,TH:1,COLGROUP:1,COL:1,UL:1,OL:1,LI:1,H1:1,H2:1,H3:1,H4:1,IMG:1,HR:1,MARK:1,FONT:1,A:1};
var DROP_TAGS = /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META|FORM|INPUT|BUTTON|TEXTAREA|SELECT|SVG|MATH|BASE|NOSCRIPT)$/;
var OK_ATTR = {colspan:1,rowspan:1,'data-ans':1,'data-ph':1,'data-rep':1,'data-label':1,'data-num':1,'data-img':1};
var OK_CLASS = {lab:1,hd:1,c:1,guide:1,cb:1,f:1,hdr:1,'in':1,ut:1,pasted:1,inl:1,big:1};
var OK_CSS = {'color':1,'background-color':1,'font-size':1,'font-weight':1,'font-style':1,'text-align':1,'text-decoration':1,'width':1,'height':1,'min-height':1,'max-width':1,'vertical-align':1,'line-height':1};
function cleanStyle(s){
  return String(s).split(';').map(function(d){
    var i = d.indexOf(':'); if (i < 0) return '';
    var p = d.slice(0,i).trim().toLowerCase(), v = d.slice(i+1).trim();
    if (!OK_CSS[p] || /url\(|expression|javascript|@import|\\|<|>/i.test(v)) return '';
    return p + ':' + v;
  }).filter(Boolean).join(';');
}
function sanitize(html){
  var src = new DOMParser().parseFromString('<body>' + html + '</body>', 'text/html').body;
  var out = document.createElement('div');
  (function walk(s, d){
    for (var n = s.firstChild; n; n = n.nextSibling){
      if (n.nodeType === 3){ d.appendChild(document.createTextNode(n.nodeValue)); continue; }
      if (n.nodeType !== 1) continue;
      var t = n.tagName;
      if (DROP_TAGS.test(t)) continue;
      if (!OK_TAGS[t]){ walk(n, d); continue; }
      if (t === 'IMG' && !n.getAttribute('data-img')) continue;
      var e = document.createElement(t.toLowerCase());
      for (var i = 0; i < n.attributes.length; i++){
        var a = n.attributes[i].name.toLowerCase(), v = n.attributes[i].value;
        if (OK_ATTR[a]) e.setAttribute(a, v);
        else if (a === 'href' && t === 'A' && /^https?:\/\/[^\s"'<>]+$/i.test(v.trim())) e.setAttribute('href', v.trim());
        else if (a === 'class'){ var c = v.split(/\s+/).filter(function(x){ return OK_CLASS[x]; }).join(' '); if (c) e.setAttribute('class', c); }
        else if (a === 'style'){ var st = cleanStyle(v); if (st) e.setAttribute('style', st); }
      }
      if (t === 'A'){
        if (!e.getAttribute('href')){ walk(n, d); continue; }
        e.setAttribute('target', '_blank'); e.setAttribute('rel', 'noopener noreferrer');
      }
      walk(n, e); d.appendChild(e);
    }
  })(src, out);
  return out.innerHTML;
}

// ───────── 문서 만들기·저장용 변환 ─────────
function mountDoc(el, html, mode){
  el.className = 'doc ' + mode;
  el.innerHTML = sanitize(html);
  el.removeAttribute('contenteditable');
  if (mode === 'student'){
    [].forEach.call(el.querySelectorAll('[data-ans]'), function(a){ a.setAttribute('contenteditable', 'true'); });
  } else if (mode === 'tpl'){
    el.setAttribute('contenteditable', 'true');
  }
  hydrate(el); renumber(el);
  if (mode === 'student') refreshBars(el);
}
function hydrate(el){
  [].forEach.call(el.querySelectorAll('img[data-img]'), function(img){
    var id = img.getAttribute('data-img');
    if (IMGC[id]){ img.src = IMGC[id]; return; }
    call('getImage', [{id:id}], function(d){ var u = 'data:' + d.mime + ';base64,' + d.data; IMGC[id] = u; img.src = u; }, function(){ img.alt = '(이미지를 불러오지 못했습니다)'; });
  });
}
function renumber(el){
  var g = {};
  [].forEach.call(el.querySelectorAll('table[data-rep]'), function(t){
    var k = t.getAttribute('data-rep'); g[k] = (g[k] || 0) + 1;
    [].forEach.call(t.querySelectorAll('[data-num]'), function(c){ c.textContent = g[k]; });
  });
}
function serialize(el){
  var c = el.cloneNode(true);
  [].forEach.call(c.querySelectorAll('.bar'), function(x){ x.remove(); });
  [].forEach.call(c.querySelectorAll('img'), function(i){
    if (i.getAttribute('data-up')) i.remove();
    else if (i.getAttribute('data-img')) i.removeAttribute('src');
  });
  [].forEach.call(c.querySelectorAll('[contenteditable]'), function(x){ x.removeAttribute('contenteditable'); });
  return c.innerHTML;
}
function ansLen(el){
  var n = 0;
  [].forEach.call(el.querySelectorAll('[data-ans]'), function(a){ n += (a.textContent || '').replace(/\s/g, '').length; });
  return n;
}
function cleanEmpty(a){
  if (a && a.hasAttribute && a.hasAttribute('data-ans') && !(a.textContent || '').trim() && !a.querySelector('img,table')) a.innerHTML = '';
}

// ───────── 반복 칸(＋ 문장 추가) ─────────
function refreshBars(el){
  [].forEach.call(el.querySelectorAll('.bar'), function(x){ x.remove(); });
  var groups = {}, order = [];
  [].forEach.call(el.querySelectorAll('table[data-rep]'), function(t){
    var k = t.getAttribute('data-rep'); if (!groups[k]){ groups[k] = []; order.push(k); } groups[k].push(t);
  });
  order.forEach(function(k){
    var ts = groups[k], last = ts[ts.length - 1];
    var bar = document.createElement('div'); bar.className = 'bar'; bar.setAttribute('contenteditable', 'false');
    var b1 = document.createElement('button'); b1.type = 'button'; b1.textContent = last.getAttribute('data-label') || '＋ 칸 추가';
    b1.onclick = function(){ addBlock(k); };
    var b2 = document.createElement('button'); b2.type = 'button'; b2.textContent = '－ 마지막 칸 지우기';
    b2.onclick = function(){ delBlock(k); };
    bar.appendChild(b1); if (ts.length > 1) bar.appendChild(b2);
    last.parentNode.insertBefore(bar, last.nextSibling);
  });
}
function addBlock(k){
  var ts = DOC.querySelectorAll('table[data-rep="' + k + '"]'), last = ts[ts.length - 1];
  var c = last.cloneNode(true);
  [].forEach.call(c.querySelectorAll('[data-ans]'), function(a){ a.innerHTML = ''; a.removeAttribute('data-ph'); a.setAttribute('contenteditable', 'true'); });
  last.parentNode.insertBefore(c, last.nextSibling);
  renumber(DOC); refreshBars(DOC); markDirty();
}
function delBlock(k){
  var ts = DOC.querySelectorAll('table[data-rep="' + k + '"]'); if (ts.length < 2) return;
  var last = ts[ts.length - 1];
  if (ansLen(last) > 0 && !confirm('마지막 칸에 쓴 내용이 있습니다. 지울까요?')) return;
  last.remove(); renumber(DOC); refreshBars(DOC); markDirty();
}

// ───────── 서식·표·이미지 도구 ─────────
function inEdit(){
  var sel = window.getSelection(); if (!sel.rangeCount || !DOC) return null;
  var n = sel.anchorNode; if (!n) return null;
  if (n.nodeType === 3) n = n.parentNode;
  if (!DOC.contains(n)) return null;
  if (MODE === 'student') return n.closest('[data-ans]') ? n : null;
  return MODE === 'tpl' ? n : null;
}
function cmd(c, v){
  if (!inEdit()){ alert('글을 쓰는 칸을 먼저 눌러 주세요.'); return; }
  document.execCommand('styleWithCSS', false, true);
  document.execCommand(c, false, v == null ? null : v);
  edited();
}
function edited(){ if (MODE === 'student') markDirty(); }
function curCell(){ var n = inEdit(); return n ? n.closest('td,th') : null; }
function ownTable(cell){ return cell ? cell.closest('table') : null; }
function userTable(cell){
  // 학생은 직접 넣은 표(.ut)만 줄·칸을 바꿀 수 있음
  var t = ownTable(cell);
  if (MODE === 'student'){ while (t && !t.classList.contains('ut')) t = t.parentNode.closest ? t.parentNode.closest('table') : null; }
  return t;
}
function tableOp(op){
  var cell = curCell(); if (!cell){ alert('표 안의 칸을 먼저 눌러 주세요.'); return; }
  var t = userTable(cell);
  if (!t){ alert(MODE === 'student' ? '직접 넣은 표에서만 줄·칸을 바꿀 수 있어요.' : '표 안의 칸을 먼저 눌러 주세요.'); return; }
  cell = cell.closest('table') === t ? cell : (function(){ var c = cell; while (c && c.closest('table') !== t) c = c.parentNode.closest('td,th'); return c; })();
  if (!cell) return;
  var row = cell.parentNode, ci = cell.cellIndex;
  if (op === 'addRow'){
    var nr = row.cloneNode(true);
    [].forEach.call(nr.children, function(td){ if (MODE === 'student' || td.hasAttribute('data-ans')) td.innerHTML = '<br>'; });
    row.parentNode.insertBefore(nr, row.nextSibling);
  } else if (op === 'delRow'){
    if (t.rows.length < 2){ alert('마지막 줄은 지울 수 없어요.'); return; }
    row.remove();
  } else if (op === 'addCol'){
    [].forEach.call(t.rows, function(r){
      var ref = r.cells[ci] || r.cells[r.cells.length - 1]; if (!ref) return;
      var nc = document.createElement(ref.tagName.toLowerCase()); nc.innerHTML = '<br>';
      if (ref.className && MODE !== 'student') nc.className = ref.className;
      r.insertBefore(nc, ref.nextSibling);
    });
  } else if (op === 'delCol'){
    if (row.cells.length < 2){ alert('마지막 칸은 지울 수 없어요.'); return; }
    [].forEach.call(t.rows, function(r){ if (r.cells[ci]) r.cells[ci].remove(); });
  }
  edited();
}
function insertTable(){
  if (!inEdit()){ alert('글을 쓰는 칸을 먼저 눌러 주세요.'); return; }
  var r = parseInt(prompt('줄 수 (1~15)', '3'), 10), c = parseInt(prompt('칸 수 (1~8)', '3'), 10);
  if (!(r > 0 && r <= 15 && c > 0 && c <= 8)) return;
  var h = '<table class="ut"><tbody>';
  for (var i = 0; i < r; i++){ h += '<tr>'; for (var j = 0; j < c; j++) h += '<td><br></td>'; h += '</tr>'; }
  h += '</tbody></table><p><br></p>';
  document.execCommand('insertHTML', false, h); edited();
}
function pickImage(){
  var n = inEdit();
  if (!n && LASTRANGE && DOC && DOC.contains(LASTRANGE.startContainer)){
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(LASTRANGE); n = inEdit();
  }
  if (!n){ alert('이미지를 넣을 칸을 먼저 눌러 주세요.'); return; }
  LASTRANGE = window.getSelection().getRangeAt(0).cloneRange();
  var f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*';
  f.onchange = function(){ if (f.files && f.files[0]) addImage(f.files[0], LASTRANGE); };

}
function addImage(file, range){
  if (!/^image\//.test(file.type)){ alert('이미지 파일만 넣을 수 있어요.'); return; }
  var rd = new FileReader();
  rd.onload = function(){
    var im = new Image();
    im.onload = function(){
      var max = 1000, w = im.width, h = im.height, k = Math.min(1, max / Math.max(w, h));
      var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
      var url = cv.toDataURL('image/jpeg', 0.75);
      if (range){ var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); }
      if (!inEdit()){ alert('이미지를 넣을 칸을 먼저 눌러 주세요.'); return; }
      var uid = 'u' + Date.now() + Math.floor(Math.random() * 1000);
      document.execCommand('insertHTML', false, '<img data-up="' + uid + '" src="' + url + '" style="width:60%">');
      var img = DOC.querySelector('img[data-up="' + uid + '"]');
      if (!img) return;
      setStatus('이미지 올리는 중…');
      api('uploadImage?act=' + encodeURIComponent(S.act || '1'), null, url, 'text/plain').then(function(j){
        if (!j.ok){ img.remove(); setStatus(''); if (j.error === 'AUTH'){ logout(true); return; } alert('이미지를 올리지 못했습니다: ' + j.error); return; }
        img.removeAttribute('data-up'); img.setAttribute('data-img', j.r.id); IMGC[j.r.id] = url; setStatus('');
        edited();
      });
      edited();
    };
    im.onerror = function(){ alert('이미지를 읽지 못했어요.'); };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}

    if (document.caretRangeFromPoint) r = document.caretRangeFromPoint(e.clientX, e.clientY);
    else if (document.caretPositionFromPoint){ var p = document.caretPositionFromPoint(e.clientX, e.clientY); r = document.createRange(); r.setStart(p.offsetNode, p.offset); r.collapse(true); }

function markDirty(){
  if (MODE !== 'student') return;
  S.dirty = true; setStatus('수정 중…');
  clearTimeout(S.timer); S.timer = setTimeout(flush, 20000);
}
function flush(done){
  clearTimeout(S.timer);
  if (MODE !== 'student' || !DOC) { if (done) done(); return; }
  if (S.saving){ S.timer = setTimeout(function(){ flush(done); }, 1200); return; }
  if (!S.dirty){ if (done) done(); return; }
  S.saving = true; S.dirty = false; setStatus('저장 중…');
  var html = serialize(DOC), ev = S.pend.splice(0), act = S.act;
  call('saveDoc', [act, html, S.ver, { len: ansLen(DOC) }, ev], function(r){
    S.saving = false;
    if (r.conflict){
      S.ver = r.ver; mountDoc(DOC, r.html, 'student');
      alert('다른 기기에서 먼저 저장한 내용이 있어 그 내용으로 다시 불러왔습니다. 방금 쓴 내용이 사라졌다면 다시 입력해 주세요.');
      setStatus(''); if (done) done(); return;
    }
    S.ver = r.ver; setStatus('저장됨 ' + fmt(r.updated).slice(11));
    if (S.dirty) flush(done); else if (done) done();
  }, function(m){
    S.saving = false; S.dirty = true; S.pend = ev.concat(S.pend);
    setStatus('저장 실패, 다시 시도합니다…'); clearTimeout(S.timer); S.timer = setTimeout(flush, 15000);
  });
}

      '<p class="small" style="margin:4px 0 0">붉은 배경 = 학생이 붙여넣거나 끌어다 놓은 글입니다. 학생이 일부 지우거나 고쳤을 수 있고, 문서 안에서 옮긴 글은 표시되지 않습니다.</p></div>' +
      (r.html ? '<div class="page"><div id="doc"></div></div>' : '<div class="card">아직 작성한 내용이 없습니다.</div>') +
      '<div class="card noprint" style="margin-top:12px"><h3 style="margin-top:0">수정 이력 (' + r.hist.length + '건)</h3><p class="small">“그때 모습 보기”는 약 2분 간격으로 남긴 화면입니다. 붙여넣기 행에는 붙여넣은 글이 기록됩니다.</p>' +
      '<div style="overflow-x:auto"><table class="ov"><tr><th>시각</th><th>구분</th><th>글자수/이미지KB</th><th>내용</th></tr>';
    var hist = r.hist.slice().reverse();
    hist.forEach(function(x){
      var isP = x[1] === '붙여넣기' || x[1] === '끌어놓기';
      h += '<tr class="' + (isP ? 'pasterow' : '') + '"><td style="white-space:nowrap">' + esc(fmt(x[0])) + '</td><td>' + esc(x[1]) + '</td><td>' + x[2] + '</td><td style="text-align:left">' +
        (isP ? esc(x[3].slice(0, 300)) + (x[3].length > 300 ? '…' : '') : (x[1] === '저장' && x[3] ? '<button class="btn sub" onclick="showSnap(' + x[3] + ')">그때 모습 보기</button>' : '')) + '</td></tr>';
    });
    h += '</table></div></div>';
    $('root').innerHTML = h;
    if (r.html){ DOC = $('doc'); mountDoc(DOC, r.html, 'view'); }
    window.scrollTo(0, 0);
  });
}
function showSnap(row){
  setStatus('불러오는 중…');
  call('getSnapshot', [row], function(r){
    setStatus('');
    var m = $('modal'); m.style.display = 'block';
    m.innerHTML = '<div class="box"><p><b>' + esc(fmt(r.time)) + ' 시점의 모습</b> <button class="btn sub" onclick="$(\'modal\').style.display=\'none\'">닫기</button></p><div class="page" style="box-shadow:none"><div id="snapdoc"></div></div></div>';
    var save = DOC; var d = $('snapdoc'); mountDoc(d, r.html, 'view'); DOC = save;
    m.scrollTop = 0;
  });
}

// ───────── 교사: 양식 편집 ─────────
var TPL_ACT = '';
function tplToolbar(){
  return studentToolbar().replace('<button onclick="insertTable()">표 넣기</button>', '<button onclick="insertTable()">표 넣기</button><button onclick="dupTable()">표 복제</button>') +
    '<span class="sep"></span>' +
    '<select onchange="if(this.value){cmd(\'formatBlock\',this.value);} this.selectedIndex=0"><option value="">문단 모양</option><option value="h2">큰 제목</option><option value="h3">소제목</option><option value="p">본문</option></select>' +
    '<span class="sep"></span><button onclick="toggleAns()" title="커서가 있는 칸을 학생이 쓰는 칸으로 지정하거나 해제">작성 칸 지정/해제</button>' +
    '<button onclick="addAnsDiv()" title="커서 위치에 학생이 쓰는 빈 칸을 넣음">작성 칸 넣기</button>' +
    '<button onclick="setPh()" title="학생이 쓰는 칸에 회색 안내문(예시)을 설정">회색 안내문</button>' +
    '<button onclick="toggleRep()" title="표를 [＋ 추가] 버튼으로 늘릴 수 있는 반복 칸으로 지정">반복 칸 지정/해제</button>' +
    '<button onclick="markGuide()" title="선택한 문단을 회색 작은 안내 글자로">안내 글자</button>' +
    '<span class="sep"></span><button onclick="addLink()" title="글자를 드래그해서 선택한 뒤 누르면 하이퍼링크를 겁니다">🔗 링크 걸기</button><button onclick="cmd(\'unlink\')">링크 풀기</button>';
}
function openTpl(act){
  MODE = ''; TPL_ACT = act; setStatus('불러오는 중…');
  call('getTemplate', [act], function(r){
    setStatus('');
    $('root').innerHTML = teacherTabs('tpl' + act) +
      '<div class="note"><b>활동 ' + act + ' 양식 편집</b> — 노란 점선 칸이 학생이 쓰는 칸이고, 초록 테두리 표는 [＋ 추가] 버튼으로 늘어나는 반복 칸입니다. 글자, 표, 이미지를 자유롭게 고치고 맨 위 [양식 저장]을 누르세요. ' +
      '<b>이미 쓰기 시작한 학생의 문서에는 반영되지 않고</b>, 아직 시작하지 않은 학생부터 새 양식이 적용됩니다. <code>{{반}}</code>·<code>{{번}}</code>은 학번에서 자동으로 채워집니다.</div>' +
      '<p class="noprint"><button class="btn" onclick="saveTpl()">양식 저장</button> <button class="btn sub" onclick="resetTpl()">처음 양식으로 되돌리기</button></p>' +
      '<div class="page"><div id="doc"></div></div>';
    DOC = $('doc'); MODE = 'tpl'; mountDoc(DOC, r.html, 'tpl');
    var tbEl = $('tb'); tbEl.style.display = 'flex'; tbEl.innerHTML = tplToolbar();
    [].forEach.call(tbEl.querySelectorAll('button,select'), function(b){ b.addEventListener('mousedown', function(e){ if (e.target.tagName !== 'SELECT') e.preventDefault(); }); });
    window.scrollTo(0, 0);
  });
}
function saveTpl(){
  var html = serialize(DOC); setStatus('저장 중…');
  call('saveTemplate', [TPL_ACT, html], function(r){ setStatus('양식 저장됨 ' + fmt(r.updated).slice(11)); alert('양식을 저장했습니다.'); });
}
function resetTpl(){
  if (!confirm('이 활동의 양식을 기본 상태로 되돌릴까요? (저장 전까지는 화면에서만 바뀝니다)')) return;
  call('defaultTemplate', [TPL_ACT], function(r){ mountDoc(DOC, r.html, 'tpl'); });
}
function selNode(){ var n = window.getSelection().anchorNode; return n ? (n.nodeType === 3 ? n.parentNode : n) : null; }
function toggleAns(){
  var n = selNode(); if (!n || !DOC.contains(n)){ alert('먼저 칸 안을 눌러 주세요.'); return; }
  var el = n.closest('[data-ans]') || n.closest('td,th') || n.closest('div,p');
  if (!el || el === DOC){ alert('칸 안을 눌러 주세요.'); return; }
  if (el.hasAttribute('data-ans')) { el.removeAttribute('data-ans'); el.removeAttribute('data-ph'); }
  else el.setAttribute('data-ans', '');
}
function addAnsDiv(){
  if (!inEdit()){ alert('칸 안을 먼저 눌러 주세요.'); return; }
  document.execCommand('insertHTML', false, '<div data-ans><br></div>');
}
function setPh(){
  var n = selNode(); var el = n && n.closest('[data-ans]');
  if (!el){ alert('학생이 쓰는(노란 점선) 칸 안을 먼저 눌러 주세요.'); return; }
  var v = prompt('칸이 비어 있을 때 회색으로 보일 안내문 (비우면 삭제)', el.getAttribute('data-ph') || '');
  if (v === null) return;
  if (v) el.setAttribute('data-ph', v); else el.removeAttribute('data-ph');
}
function toggleRep(){
  var n = selNode(); var t = n && n.closest('table');
  if (!t || !DOC.contains(t)){ alert('표 안을 먼저 눌러 주세요.'); return; }
  if (t.hasAttribute('data-rep')){ t.removeAttribute('data-rep'); t.removeAttribute('data-label'); renumber(DOC); return; }
  var g = prompt('같은 묶음으로 늘어날 표들의 묶음 이름 (영문/숫자, 예: g1)', 'g1'); if (!g) return;
  g = g.replace(/[^A-Za-z0-9_]/g, '') || 'g1';
  var label = prompt('추가 버튼에 쓸 글자', '＋ 칸 추가') || '＋ 칸 추가';
  t.setAttribute('data-rep', g); t.setAttribute('data-label', label);
  renumber(DOC);
}
function dupTable(){
  var n = selNode(); var t = n && n.closest('table');
  if (!t || !DOC.contains(t)){ alert('복제할 표 안을 먼저 눌러 주세요.'); return; }
  var c = t.cloneNode(true); t.parentNode.insertBefore(c, t.nextSibling); renumber(DOC);
}
function addLink(){
  if (!inEdit()){ alert('링크를 걸 글자를 먼저 드래그해서 선택해 주세요.'); return; }
  if (window.getSelection().isCollapsed){ alert('링크를 걸 글자를 먼저 드래그해서 선택해 주세요.'); return; }
  var u = prompt('연결할 주소 (예: https://www.korean.go.kr)', 'https://'); if (!u) return;
  u = u.trim(); if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  if (!/^https?:\/\/[^\s"'<>]+$/i.test(u)){ alert('주소 형식이 올바르지 않습니다.'); return; }
  document.execCommand('createLink', false, u);
  [].forEach.call(DOC.querySelectorAll('a[href]'), function(a){ a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener noreferrer'); });
}
function markGuide(){
  if (!inEdit()){ alert('칸 안을 먼저 눌러 주세요.'); return; }
  var n = selNode(); var p = n.closest('p,div'); if (!p || p === DOC) return;
  p.classList.toggle('guide');
}


// ───────── 교사: 명단·개인 코드 ─────────
var RO = [], ROFILTER = '';
function openRoster(){
  MODE = ''; DOC = null; $('tb').style.display = 'none'; setStatus('불러오는 중…');
  call('rosterList', [], function(list){ RO = list; setStatus(''); renderRoster(); });
}
var ROSEL = {};
function classKey(id){ return /^\d{5}$/.test(id) ? id.slice(0, 3) : '기타'; }
function classLabel(k){ return k === '기타' ? '기타' : Number(k.slice(1)) + '반'; }
// 반 선택 버튼 줄: fn = 'ROFILTER' 또는 'FILTER' 를 바꾸고 다시 그리는 함수 이름
function classButtons(all, cur, setter){
  var keys = {}; all.forEach(function(s){ keys[classKey(s.id)] = (keys[classKey(s.id)] || 0) + 1; });
  var ks = Object.keys(keys).sort();
  var h = '<div class="tabs noprint" style="margin:6px 0"><button class="' + (!cur ? 'on' : '') + '" onclick="' + setter + '(\'\')">전체 (' + all.length + ')</button>';
  ks.forEach(function(k){ h += '<button class="' + (cur === k ? 'on' : '') + '" onclick="' + setter + '(\'' + k + '\')">' + classLabel(k) + ' (' + keys[k] + ')</button>'; });
  return h + '</div>';
}
function setRoFilter(k){ ROFILTER = k; renderRoster(); }
function setOvFilter(k){ FILTER = k; renderOverview(); }
function renderRoster(){
  var list = RO.filter(function(s){ return !ROFILTER || classKey(s.id) === ROFILTER; });
  var selN = Object.keys(ROSEL).length;
  var allOn = list.length > 0 && list.every(function(s){ return ROSEL[s.id]; });
  var h = teacherTabs('roster') +
    '<div class="card noprint"><b>학생 등록</b>' +
    '<p class="small" style="margin:4px 0">엑셀이나 한글 표에서 <b>학번</b>과 <b>별칭</b>(실명 대신 쓸 이름 또는 번호) 두 열을 복사해서 아래에 붙여넣으세요. 한 줄에 한 명입니다. 학번은 5자리(예: 20507 = 2학년 5반 7번)로 쓰면 반·번호가 양식에 자동으로 채워집니다. 이미 등록된 학번은 별칭만 바뀌고 개인 코드는 그대로입니다.</p>' +
    '<textarea id="roIn" rows="4" style="width:100%;font:inherit;padding:8px;border:1px solid #bbb;border-radius:6px" placeholder="20501\t가나다\n20502\t라마바"></textarea>' +
    '<p><button class="btn" onclick="roImport()">등록하고 개인 코드 만들기</button></p></div>' +
    '<div class="card"><div class="noprint">' + classButtons(RO, ROFILTER, 'setRoFilter') +
    '<p style="margin:6px 0"><button class="btn" onclick="showCards()"' + (selN ? '' : ' disabled') + '>🖨 선택한 ' + selN + '명 코드지 인쇄</button> ' +
    '<button class="btn sub" onclick="roSelAll(' + (allOn ? 'false' : 'true') + ')">' + (allOn ? '보이는 학생 선택 해제' : '보이는 학생 모두 선택') + '</button> ' +
    '<button class="btn sub" onclick="roCsv()">CSV 내려받기(엑셀용)</button> <span class="small">보이는 ' + list.length + '명 / 전체 ' + RO.length + '명</span></p>' +
    '<p class="small">코드지를 뽑을 학생을 체크하세요(반을 바꿔도 체크는 유지됩니다). 개인 코드는 학생 본인에게만 알려 주세요. 잃어버리거나 유출되면 [재발급]을 누르세요(예전 코드와 로그인 상태는 바로 무효가 됩니다).</p></div>' +
    '<div style="overflow-x:auto"><table class="ov"><tr><th style="width:36px"><input type="checkbox" ' + (allOn ? 'checked ' : '') + 'onchange="roSelAll(this.checked)"></th><th>학번</th><th>별칭</th><th>개인 코드</th><th>활동</th><th>관리</th></tr>';
  list.forEach(function(s){
    h += '<tr><td><input type="checkbox" ' + (ROSEL[s.id] ? 'checked ' : '') + 'onchange="roSel(\'' + esc(s.id) + '\',this.checked)"></td><td class="n">' + esc(s.id) + '</td><td class="n">' + esc(s.name) + '</td><td style="font-family:monospace;font-size:15px;letter-spacing:1px">' + esc(s.code) + '</td><td>' + actLabel(s.acts) + '</td>' +
      '<td><button class="btn sub" onclick="roReset(\'' + esc(s.id) + '\')">재발급</button> <button class="btn sub" onclick="roDel(\'' + esc(s.id) + '\')">삭제</button></td></tr>';
  });
  h += '</table></div></div>';
  $('root').innerHTML = h;
}
function roSel(id, on){ if (on) ROSEL[id] = 1; else delete ROSEL[id]; renderRoster(); }
function roSelAll(on){
  RO.filter(function(s){ return !ROFILTER || classKey(s.id) === ROFILTER; }).forEach(function(s){ if (on) ROSEL[s.id] = 1; else delete ROSEL[s.id]; });
  renderRoster();
}

// ───────── 개인 코드지 인쇄 (A4 한 장에 6장 또는 8장) ─────────
var CARDN = 8;
function showCards(){
  var sel = RO.filter(function(s){ return ROSEL[s.id]; });
  if (!sel.length){ alert('코드지를 뽑을 학생을 먼저 체크해 주세요.'); return; }
  var per = CARDN, url = location.origin, pages = [];
  for (var i = 0; i < sel.length; i += per) pages.push(sel.slice(i, i + per));
  var h = '<div class="noprint card"><button class="btn sub" onclick="renderRoster()">← 명단으로</button> ' +
    '한 장에 <select id="cardn" style="width:auto;display:inline-block" onchange="CARDN=Number(this.value);showCards()"><option value="6"' + (per === 6 ? ' selected' : '') + '>6장</option><option value="8"' + (per === 8 ? ' selected' : '') + '>8장</option></select> ' +
    '<button class="btn" onclick="window.print()">인쇄 (' + sel.length + '명, ' + pages.length + '쪽)</button> ' +
    '<span class="small">인쇄 창에서 용지 A4, 배율 100%(또는 “실제 크기”), 여백 “기본”으로 두고, 머리글·바닥글은 끄세요. 점선을 따라 자르면 됩니다.</span></div>';
  pages.forEach(function(pg){
    h += '<div class="sheet n' + per + '">';
    pg.forEach(function(s){
      h += '<div class="cardp"><div class="ct">〈화법과 언어〉 자율 탐구 보고서</div>' +
        '<div class="cr"><span class="cl">학번</span><b>' + esc(s.id) + '</b>' + (s.name ? '<span class="cn">' + esc(s.name) + '</span>' : '') + '</div>' +
        '<div class="cl2">개인 코드</div><div class="cc">' + esc(s.code) + '</div>' +
        '<div class="cu">접속 주소<br><b>' + esc(url.replace(/^https?:\/\//, '')) + '</b></div>' +
        '<div class="cw">※ 이 코드는 나만 사용하세요. 다른 사람에게 알려 주거나 사진으로 올리지 마세요. 잃어버리면 선생님께 말씀드리세요.</div></div>';
    });
    for (var k = pg.length; k < per; k++) h += '<div class="cardp empty"></div>';
    h += '</div>';
  });
  $('root').innerHTML = h;
  window.scrollTo(0, 0);
}
function roImport(){
  var lines = $('roIn').value.split(/\r?\n/), items = [];
  lines.forEach(function(l){
    l = l.trim(); if (!l) return;
    var p = l.split(/\t|,|\s{2,}|\s+/);
    var id = (p[0] || '').trim(); if (!id || !/^[0-9A-Za-z_-]+$/.test(id)) return;
    items.push({ id: id, name: p.slice(1).join(' ').trim() });
  });
  if (!items.length){ alert('등록할 줄이 없습니다. 학번과 별칭을 한 줄에 한 명씩 붙여넣어 주세요.'); return; }
  if (!confirm(items.length + '명을 등록할까요?')) return;
  call('rosterImport', [items], function(r){ alert('새로 ' + r.added + '명 등록, ' + r.updated + '명은 별칭만 갱신했습니다.'); openRoster(); });
}
function roReset(id){
  if (!confirm(id + ' 학생의 개인 코드를 새로 만들까요? 예전 코드는 바로 쓸 수 없게 됩니다.')) return;
  call('rosterResetCode', [id], function(r){ RO.forEach(function(s){ if (s.id === id) s.code = r.code; }); renderRoster(); });
}
function roDel(id){
  if (!confirm(id + ' 학생을 명단에서 지울까요? (이미 쓴 보고서 기록은 남지만 이 학생은 더 이상 로그인할 수 없습니다)')) return;
  call('rosterDelete', [[id]], function(){ RO = RO.filter(function(s){ return s.id !== id; }); renderRoster(); });
}
function roCsv(){
  var rows = [['학번', '별칭', '개인코드', '활동']].concat(RO.map(function(s){ return [s.id, s.name, s.code, s.acts]; }));
  var csv = '﻿' + rows.map(function(r){ return r.map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' })); a.download = '자율탐구_명단.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
